name: Build and Publish Flatpak

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    name: Check for Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run External Data Checker
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        env:
          GIT_AUTHOR_NAME: Flatpak External Data Checker
          GIT_COMMITTER_NAME: Flatpak External Data Checker
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --update --commit-only com.lobehub.LobeHub.yml

      - name: Push changes
        if: github.event_name != 'pull_request'
        run: |
          git push || echo "No changes to push"

  build:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs: update
    container:
      image: ghcr.io/andyholmes/flatter/freedesktop:25.08
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flatpak dependencies
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08

      - name: Build
        uses: andyholmes/flatter@main
        with:
          files: com.lobehub.LobeHub.yml
          upload-pages-artifact: true

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
