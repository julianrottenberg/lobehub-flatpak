app-id: com.lobehub.LobeHub
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: run.sh
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --filesystem=xdg-download
modules:
  - name: lobehub
    buildsystem: simple
    build-commands:
      - chmod +x LobeHub.AppImage
      - ./LobeHub.AppImage --appimage-extract
      - rm LobeHub.AppImage
      - cp squashfs-root/lobehub-desktop.desktop com.lobehub.LobeHub.desktop
      - desktop-file-edit --set-icon com.lobehub.LobeHub --set-key Exec --set-value 'run.sh %u' com.lobehub.LobeHub.desktop
      - cp squashfs-root/usr/share/icons/hicolor/514x514/apps/lobehub-desktop.png com.lobehub.LobeHub.png || cp squashfs-root/lobehub-desktop.png com.lobehub.LobeHub.png || true
      - convert com.lobehub.LobeHub.png -resize 512x512! com.lobehub.LobeHub.png || ffmpeg -i com.lobehub.LobeHub.png -vf scale=512:512 com.lobehub.LobeHub.png -y || true
      - install -D run.sh -t /app/bin
      - install -Dm644 com.lobehub.LobeHub.metainfo.xml -t /app/share/metainfo
      - install -Dm644 com.lobehub.LobeHub.desktop -t /app/share/applications
      - install -Dm644 com.lobehub.LobeHub.png -t /app/share/icons/hicolor/512x512/apps || true
      - mv squashfs-root /app/bin/lobehub
    sources:
      - type: file
        url: https://github.com/lobehub/lobehub/releases/download/v2.1.56/LobeHub-2.1.56.AppImage
        sha256: 5f0c4afb957210ad93aa35ccb7e87c6a3a8ddd738c134e1c33a7d8818b6b4c66
        dest-filename: LobeHub.AppImage
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/lobehub/lobehub/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name=="LobeHub-" + $version + ".AppImage") | .browser_download_url
      - type: file
        path: com.lobehub.LobeHub.metainfo.xml
      - type: file
        path: com.lobehub.LobeHub.desktop
      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper.sh /app/bin/lobehub/lobehub "$@"
